name: Banana Android Release

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-release:
    name: Build Banana Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest commit
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.11.0'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Make Gradle executable
        working-directory: android
        run: chmod +x gradlew

      - name: Build Banana release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk banana-release.apk

      - name: Upload Banana APK
        uses: actions/upload-artifact@v4
        with:
          name: banana-release
          path: banana-release.apk
          if-no-files-found: error
          retention-days: 30
